<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1630"/>
      <stop offset="100%" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6F1FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- orbita -->
  <ellipse cx="256" cy="256" rx="150" ry="54" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.55" transform="rotate(-25 256 256)"/>
  <circle cx="375" cy="239" r="7" fill="#E6F1FF"/>

  <!-- letra H -->
  <g stroke="url(#h)" stroke-width="22" stroke-linecap="round" fill="none">
    <line x1="190" y1="170" x2="190" y2="342"/>
    <line x1="322" y1="170" x2="322" y2="342"/>
  </g>

  <!-- sol (helios) no lugar da barra -->
  <circle cx="256" cy="256" r="22" fill="#FFC857" filter="url(#glow)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
